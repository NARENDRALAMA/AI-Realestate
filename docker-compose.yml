services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/propcopy.db:/app/propcopy.db
    environment:
      # Content is generated by the LLM (Mistral via Ollama running on the host
      # machine: `ollama serve` + `ollama pull mistral`). Templates are only a
      # fallback if the model is unreachable or times out.
      - USE_LLM=true
      - LLM_BACKEND=ollama
      - LLM_MODEL_NAME=mistral
      - LLM_OLLAMA_URL=http://host.docker.internal:11434
      - LLM_TIMEOUT_SECONDS=180
      # Start Ollama with OLLAMA_NUM_PARALLEL=4 so the four channels are written at once.
      - LLM_STREAM_CONCURRENCY=4
    extra_hosts:
      # Lets the container reach Ollama on the host on Linux too (built in on Mac/Windows).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
